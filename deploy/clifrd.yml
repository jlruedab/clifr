# clifrd settings. Every value here is the default; flags given to clifrd
# override them. Sizes: K, M, G (powers of 1024); durations: s, m, h.

data_dir: /var/lib/clifr
retention: 72h         # delete data older than this (0 = keep)
max_size: 2G           # the oldest hours are deleted above this (0 = no cap)
log_level: info        # error, warn, info, debug

intervals:
  process: 30s         # per-process CPU, memory, state and I/O; sockets (v1)
  system: 10s          # system counters (vmstat, mpstat, iostat, free, uptime), at most process
  files: 120s          # open-file walks (long-held files only); at least process
  keyframe: 300s       # full socket dump: queues, UDP, check of the TCP events
  flush: 5m            # write buffered rows (a crash loses at most this much)

collectors:
  process_events: auto # auto (eBPF, else the proc connector), ebpf, proc_connector, none
  tcp: auto            # auto (eBPF events and keyframes, else sampling), ebpf, sample
  files: held          # held (fds held across two walks, and deleted files) or all
  process_io: true     # per-process I/O counters, read when the process used CPU and at fd walks

cpu_budget: 2%         # of one core over 5 minutes; above it the fd interval is
                       # lengthened when fd walks are a quarter of the cost or more
gc_heap_target: 256M   # heap up to which garbage is collected at Go's default rate
max_cmdline: 64K       # bytes of each command line stored; longer ones are cut
memory_guard: 384M     # live heap above which data is shed (guard event) before
                       # the unit's MemoryMax (768M) is reached

# Prometheus metrics (Node Exporter's names, and clifr_*) at ADDR/metrics.
# Off by default. Without TLS loopback addresses only. Under the systemd
# unit it also needs the drop-in /usr/share/clifr/clifrd-metrics.conf (the
# unit allows no TCP otherwise; see that file).
#metrics: 127.0.0.1:9100
# TLS and basic authentication for it, in Node Exporter's web configuration
# format (its --web.config.file: an existing web-config.yml works); with
# tls_server_config any address, e.g. metrics: :9100.
#metrics_tls_config: /etc/clifr/web-config.yml

# Serve the recording to clifr --host on another machine (off by default).
# Every request needs a token (clifrd token new: their SHA-256 are kept in
# serve_tokens); TLS with clifrd's self-signed certificate (made at first
# start in serve_tls_dir, its fingerprint logged), except on a loopback
# address. Under the systemd unit it also needs the drop-in
# /usr/share/clifr/clifrd-serve.conf, and the port open in the firewall.
#serve: :8443
#serve_tokens: /etc/clifr/serve-tokens
#serve_tls_dir: /var/lib/clifr/serve-tls
# Your own certificate instead of the self-signed one, in Node Exporter's web
# configuration format (its tls_server_config; may be metrics_tls_config's
# file): clifr --host then checks it with --tls-ca or the system's CAs
# instead of pinning it. TLS on loopback addresses too.
#serve_tls_config: /etc/clifr/web-config.yml

# Masked in command lines (as ***) before they are stored: Go regular
# expressions; with capture groups only the groups are masked. (The built-in
# default is none; these are suggestions.)
redact:
  - '(?i)--?(?:password|passwd|pass|pwd|secret|token|api[-_]?key|access[-_]?key)[= ](\S+)'
  - '(?i)\b(?:password|passwd|pwd|secret|token)=(\S+)'
  - '://[^/\s:@]+:([^@\s]+)@'   # user:password@ in URLs

# CPU and memory hard limits, file-system protection and capabilities are
# set in the systemd unit (clifrd.service) or a drop-in file.
