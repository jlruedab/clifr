# Drop-in for clifrd.service: lets clifrd serve its recording to clifr --host
# (serve: :8443 in /etc/clifr/clifrd.yml, or --serve). The shipped unit allows
# only netlink and Unix sockets, so without this drop-in clifrd cannot listen
# on TCP. Install it with:
#
#   sudo install -D -m 0644 /usr/share/clifr/clifrd-serve.conf \
#       /etc/systemd/system/clifrd.service.d/serve.conf
#   sudo systemctl daemon-reload && sudo systemctl restart clifrd
#
# Every request needs a token (clifrd token new) and, except on a loopback
# address, uses TLS with clifrd's own certificate, which clifr pins. Remove
# this file (and the serve: setting) to go back to no network at all.
[Service]
# Added to the unit's list (repeated settings are merged): TCP sockets.
RestrictAddressFamilies=AF_INET AF_INET6
# Clients may connect from anywhere the firewall lets them. To allow only
# your admin networks here, replace "any" with them, e.g.
#   IPAddressAllow=10.20.0.0/16 192.168.1.0/24
# (with the metrics drop-in as well, which denies all but loopback, this
# allow list is what lets clients in: allow wins over deny).
IPAddressAllow=any
