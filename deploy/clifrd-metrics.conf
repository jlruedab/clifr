# Drop-in for clifrd.service: lets clifrd serve Prometheus metrics
# (metrics: 127.0.0.1:9100 in /etc/clifr/clifrd.yml, or --metrics). The
# shipped unit allows only netlink and Unix sockets, so without this drop-in
# clifrd cannot listen on TCP. Install it with:
#
#   sudo install -D -m 0644 /usr/share/clifr/clifrd-metrics.conf \
#       /etc/systemd/system/clifrd.service.d/metrics.conf
#   sudo systemctl daemon-reload && sudo systemctl restart clifrd
#
# Remove it (and the metrics: setting) to go back to no network at all.
[Service]
# Added to the unit's list (repeated settings are merged): TCP sockets.
RestrictAddressFamilies=AF_INET AF_INET6
# IP traffic of the service only over the loopback interface: without TLS
# /metrics accepts loopback addresses only, and this holds even if that
# changes.
IPAddressDeny=any
IPAddressAllow=localhost
# A Prometheus server on another machine: with metrics_tls_config (TLS, and
# basic_auth_users or client certificates) uncomment and give its addresses
# (allow wins over deny; the lists are merged):
#IPAddressAllow=10.20.0.5 192.168.1.0/24
